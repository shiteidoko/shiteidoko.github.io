<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos</title>

  <!-- FsLightbox Library (Single File, No Dependencies) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fslightbox/3.4.1/index.js"></script>

  <style>
    /* Minima Theme Palette Alignment */
    :root {
      --brand-color: #2a7ae2;
      --text-color: #111111;
      --background-color: #fdfdfd;
      --border-color: #e8e8e8;
      --grey-color-light: #fefefe;
      --grey-color-dark: #828282;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      line-height: 1.5;
    }

    .site-container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Minima Heading & Section Styles */
    .year-section {
      margin-bottom: 2.5rem;
    }

    .year-title {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: -1px;
      color: var(--text-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 1.25rem;
    }

    /* Photo Grid Layout */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* Card Styling using Minima Borders & Colors */
    .photo-card {
      display: block;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      text-decoration: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-card:hover {
      border-color: var(--brand-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .photo-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .photo-caption {
      padding: 10px 12px;
      font-size: 0.875rem;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* FsLightbox Native Navigation Overrides */
    .fslightbox-slide-btn-container {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 50%;
    }

    .fslightbox-slide-btn-container:hover {
      background: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="site-container">
    {% assign photos_by_year = site.data.photos | group_by: "year" | sort: "name" | reverse %}

    {% for year_group in photos_by_year %}
      <section class="year-section">
        <h2 class="year-title">{{ year_group.name }}</h2>
        
        <div class="photo-grid">
          {% for photo in year_group.items %}
            <a data-fslightbox="gallery-{{ year_group.name }}" 
               data-caption="{{ photo.title }}" 
               href="{{ photo.image }}" 
               class="photo-card">
              
              <img src="{{ photo.thumbnail | default: photo.image }}" alt="{{ photo.title }}" loading="lazy">
              <div class="photo-caption">{{ photo.title }}</div>
            </a>
          {% endfor %}
        </div>
      </section>
    {% endfor %}
  </div>

</body>
</html>
