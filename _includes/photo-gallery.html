<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>

  <!-- FsLightbox Library (Single File, No Dependencies) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fslightbox/3.4.1/index.js"></script>

  <style>
    /* Base Page Styling */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Section & Year Header Styling */
    .year-section {
      margin-bottom: 3rem;
    }

    .year-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #334155;
    }

    /* Responsive Grid Layout */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    /* Photo Card Styling */
    .photo-card {
      display: block;
      position: relative;
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .photo-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .photo-caption {
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Customizing FsLightbox Controls */
    /* Close Button Hover Accent */
    .fslightbox-toolbar-button:first-child:hover .fslightbox-svg {
      fill: #ef4444 !important;
    }

    /* Next / Previous Navigation Arrows Visibility */
    .fslightbox-slide-btn-container {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin: 0 10px;
    }

    .fslightbox-slide-btn-container:hover {
      background: rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <div class="container">
    {% assign photos_by_year = site.data.photos | group_by: "year" | sort: "name" | reverse %}

    {% for year_group in photos_by_year %}
      <section class="year-section">
        <h2 class="year-title">{{ year_group.name }}</h2>
        
        <div class="photo-grid">
          {% for photo in year_group.items %}
            <a data-fslightbox="gallery-{{ year_group.name }}" 
               data-caption="{{ photo.title }}" 
               href="{{ photo.image }}" 
               class="photo-card">
              
              <img src="{{ photo.thumbnail | default: photo.image }}" alt="{{ photo.title }}" loading="lazy">
              <div class="photo-caption">{{ photo.title }}</div>
            </a>
          {% endfor %}
        </div>
      </section>
    {% endfor %}
  </div>

</body>
</html>
