<header class="site-header" role="banner">
  <div class="wrapper">
    {%- assign default_paths = site.pages | map: "path" -%}
    {%- assign page_paths = site.header_pages | default: default_paths -%}
    
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      <!-- Add your icon here -->
      <img src="{{ '/logos/logo.png' | relative_url }}" alt="" class="site-icon">
      {{ site.title | escape }}
    </a>

    {%- if page_paths -%}
      <nav class="site-nav">
        <!-- Default navigation menu items remain here -->
      </nav>
    {%- endif -%}
  </div>
</header>
